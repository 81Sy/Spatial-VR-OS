<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d"><meta name="description" content="Spatial VR OS — لوحة فضائية للمواقع والفيديو على الهاتف">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/spatial-icon.svg" type="image/svg+xml">
<title>Spatial VR OS</title><link rel="stylesheet" href="style.css">
</head>
<body class="theme-aurora">
<header class="normal-toolbar" id="normalToolbar">
  <div class="brand-lockup"><span class="brand-mark">◉</span><span><b>Spatial VR OS</b><small>مساحتك الرقمية</small></span></div>
  <div class="toolbar-actions"><span class="secure-state" id="connectionStatus">● متصل</span><button class="glass-button" data-action="settings" aria-label="الإعدادات">⚙</button><button class="primary-button" data-action="toggle-vr">◉ وضع النظارة</button></div>
</header>
<main id="appShell">
  <div class="eye-stage" id="eyeStage">
    <article class="eye" data-eye="0" aria-label="واجهة العين اليسرى">
      <div class="glass-screen">
        <div class="system-bar"><span class="system-icons">◈ &nbsp; <span data-online-label>متصل</span></span><time data-clock>--:--</time><span class="system-title">Spatial Lite</span><span class="system-icons">HTTPS ◇</span></div>
        <div class="room-layout">
          <nav class="side-rail" aria-label="التنقل الرئيسي">
            <button class="rail-button selected" data-action="home"><span>⌂</span><small>الرئيسية</small></button>
            <button class="rail-button" data-action="apps"><span>◫</span><small>تطبيقاتي</small></button>
            <button class="rail-button" data-action="app" data-app="youtube"><span class="brand-chip youtube">▶</span><small>YouTube</small></button>
            <button class="rail-button" data-action="browser"><span>◎</span><small>المتصفح</small></button>
            <button class="rail-button" data-action="video"><span>▷</span><small>الفيديو</small></button>
            <button class="rail-button" data-action="favorites"><span>☆</span><small>المفضلة</small></button>
            <button class="rail-button" data-action="settings"><span>⚙</span><small>الضبط</small></button><button class="rail-button" data-action="immersive"><span>◌</span><small>إخفاء</small></button>
          </nav>
          <section class="viewport">
            <div class="page-content" data-page-content></div>
            <div class="app-dock" aria-label="التطبيقات السريعة">
              <button data-action="apps" title="كل التطبيقات">▦</button>
              <button data-action="app" data-app="youtube" title="YouTube"><span class="brand-chip youtube">▶</span></button>
              <button data-action="app" data-app="kick" title="Kick"><span class="brand-chip kick">K</span></button>
              <button data-action="app" data-app="twitch" title="Twitch"><span class="brand-chip twitch">▣</span></button>
              <button data-action="browser" title="المتصفح"><span class="brand-chip browser">◎</span></button>
              <button data-action="video" title="مشغل الفيديو"><span class="brand-chip video">▷</span></button>
            </div>
          </section>
          <aside class="favorite-rail">
            <div class="favorite-heading"><span>⭐</span><b>المفضلة</b><button data-action="add-favorite" aria-label="إضافة للمفضلة">＋</button></div>
            <div class="favorite-list" data-favorite-list></div>
            <button class="manage-favorites" data-action="favorites">إدارة المفضلة</button>
          </aside>
        </div>
        <button class="vr-exit" data-action="toggle-vr" aria-label="إيقاف وضع النظارة">⤢ خروج</button>
      </div>
    </article>
    <article class="eye" data-eye="1" aria-label="واجهة العين اليمنى">
      <div class="glass-screen">
        <div class="system-bar"><span class="system-icons">◈ &nbsp; <span data-online-label>متصل</span></span><time data-clock>--:--</time><span class="system-title">Spatial Lite</span><span class="system-icons">HTTPS ◇</span></div>
        <div class="room-layout">
          <nav class="side-rail" aria-label="التنقل الرئيسي">
            <button class="rail-button selected" data-action="home"><span>⌂</span><small>الرئيسية</small></button>
            <button class="rail-button" data-action="apps"><span>◫</span><small>تطبيقاتي</small></button>
            <button class="rail-button" data-action="app" data-app="youtube"><span class="brand-chip youtube">▶</span><small>YouTube</small></button>
            <button class="rail-button" data-action="browser"><span>◎</span><small>المتصفح</small></button>
            <button class="rail-button" data-action="video"><span>▷</span><small>الفيديو</small></button>
            <button class="rail-button" data-action="favorites"><span>☆</span><small>المفضلة</small></button>
            <button class="rail-button" data-action="settings"><span>⚙</span><small>الضبط</small></button><button class="rail-button" data-action="immersive"><span>◌</span><small>إخفاء</small></button>
          </nav>
          <section class="viewport">
            <div class="page-content" data-page-content></div>
            <div class="app-dock" aria-label="التطبيقات السريعة">
              <button data-action="apps" title="كل التطبيقات">▦</button>
              <button data-action="app" data-app="youtube" title="YouTube"><span class="brand-chip youtube">▶</span></button>
              <button data-action="app" data-app="kick" title="Kick"><span class="brand-chip kick">K</span></button>
              <button data-action="app" data-app="twitch" title="Twitch"><span class="brand-chip twitch">▣</span></button>
              <button data-action="browser" title="المتصفح"><span class="brand-chip browser">◎</span></button>
              <button data-action="video" title="مشغل الفيديو"><span class="brand-chip video">▷</span></button>
            </div>
          </section>
          <aside class="favorite-rail">
            <div class="favorite-heading"><span>⭐</span><b>المفضلة</b><button data-action="add-favorite" aria-label="إضافة للمفضلة">＋</button></div>
            <div class="favorite-list" data-favorite-list></div>
            <button class="manage-favorites" data-action="favorites">إدارة المفضلة</button>
          </aside>
        </div>
        <button class="vr-exit" data-action="toggle-vr" aria-label="إيقاف وضع النظارة">⤢ خروج</button>
      </div>
    </article>
  </div>
</main>
<div class="portrait-warning" aria-live="polite"><span>◉</span><b>أدر الهاتف أفقيًا</b><small>لوضع النظارة، استخدم iPhone بالاتجاه الأفقي.</small></div>
<video id="panoSource" class="pano-source" playsinline webkit-playsinline crossorigin="anonymous"></video>
<input id="local360File" type="file" accept="video/*" hidden>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body></html>
